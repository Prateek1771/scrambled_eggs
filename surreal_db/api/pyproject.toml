[project]
name = "cortex-api"
version = "0.1.0"
description = "CORTEX: FastAPI + LangGraph agent whose memory is a SurrealDB database."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    # Added in M2, when the agent lands.
    "langgraph>=1.2",
    "langchain-openai>=1.6",
    "surrealdb>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortex"]
