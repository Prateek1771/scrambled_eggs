[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    slow: needs the medium or huge corpus; excluded from the pre-commit loop
    chaos: restarts containers or kills sockets; do not run against anything you care about
    e2e: drives a real browser through Playwright
    llm: calls OpenAI and costs money; excluded with -m "not llm"
filterwarnings =
    ignore::DeprecationWarning
